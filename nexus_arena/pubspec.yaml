name: nexus_arena
description: "NEXUS ARENA — Esports Tournament Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.2

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # UI utilities
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # UI & animations
  shimmer: ^3.0.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.19.0
  share_plus: ^12.0.2
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^17.0.0

  # Payments
  razorpay_flutter: ^1.3.6

  # KYC document capture
  image_picker: ^1.1.2

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
